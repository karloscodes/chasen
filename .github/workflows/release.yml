# A tag v* makes a release: the CLI for macOS and Linux, the server for
# Linux, and checksums.txt. The install scripts download the newest release,
# and a release reaches every server the same night.
# The test job is the same in chasen, lognorth-cli, and suppyhq-cli. Each
# builds and publishes its own binaries.
name: Release
on:
  push:
    tags: ["v*"]
  # Security release starts it for a tag it pushed: see security-release.yml.
  workflow_dispatch:

# Read only by default: only the job that publishes can write the release.
permissions:
  contents: read

jobs:
  # The same gate as CI, so a tag on a red commit releases nothing. A release
  # is made only from a commit of main.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # The end-to-end test starts a real SSH server, for the SSH way to a server.
      - run: test -x /usr/sbin/sshd || (sudo apt-get update -q && sudo apt-get install -y -q openssh-server)
      - run: bin/e2e -test.v

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Nothing restored. The job that publishes keeps no module cache
      # and no build cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flags="-s -w -X main.version=$GITHUB_REF_NAME"
          # Outside the checkout. An untracked file in it makes the build +dirty.
          out="${RUNNER_TEMP}/dist"
          mkdir -p "$out"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -ldflags "$flags" -o "$out/chasen-${target%/*}-${target#*/}" ./cmd/chasen
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -ldflags "$flags" -o "$out/chasen-server-linux-$arch" ./cmd/chasen-server
          done
          # The module path comes from the checkout. The stamp check runs
          # beside the binaries, which are outside it.
          mod="$(go list -m)"
          (
            cd "$out"
            sha256sum chasen-* > checksums.txt
            want="go$(awk '/^go / { print $2; exit }' "$GITHUB_WORKSPACE/go.mod")"
            tab="$(printf '\t')"
            for bin in chasen-*; do
              info="$(go version -m "$bin")"
              case "$info" in
                "$bin: $want"$'\n'*) ;;
                *) echo "$bin was built with another Go than $want"; printf '%s\n' "$info"; exit 1 ;;
              esac
              case "$info" in
                *"${tab}build${tab}vcs.modified=false"*) ;;
                *) echo "$bin was built from a modified checkout"; printf '%s\n' "$info"; exit 1 ;;
              esac
              # A release tag is v*. Another tag is not a module version.
              case "$GITHUB_REF" in
                refs/tags/v*)
                  case "$info" in
                    *"${tab}mod${tab}${mod}${tab}${GITHUB_REF_NAME}${tab}"*) ;;
                    *) echo "$bin is not the module version $GITHUB_REF_NAME"; printf '%s\n' "$info"; exit 1 ;;
                  esac
                  ;;
              esac
            done
          )
      # workflow_dispatch can be started from a branch or from a tag that
      # is not v*. The module-version check runs only for refs/tags/v*,
      # so publish does too: a non-v tag cannot become a release.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v1.5.0-rc.1) is a pre-release, which
          # releases/latest skips: no install or update takes it.
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --prerelease="$prerelease" "$RUNNER_TEMP"/dist/*

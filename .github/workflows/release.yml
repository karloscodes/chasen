# A tag v* makes a release: the CLI for macOS and Linux, the server for
# Linux, and checksums.txt. The install scripts download the newest release.
name: Release
on:
  push:
    tags: ["v*"]
  # Release on fix starts it for a tag it pushed: see release-on-fix.yml.
  workflow_dispatch:

# Read only by default: only the job that publishes can write the release.
permissions:
  contents: read

jobs:
  # A release reaches every server the same night. It is made only from a
  # commit of main that passes the end-to-end test.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      # The end-to-end test starts a real SSH server, for the SSH way to a server.
      - run: test -x /usr/sbin/sshd || (sudo apt-get update -q && sudo apt-get install -y -q openssh-server)
      - run: bin/e2e -test.v

  release:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          flags="-s -w -X main.version=$GITHUB_REF_NAME"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -ldflags "$flags" -o dist/chasen-${target%/*}-${target#*/} ./cmd/chasen
          done
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -ldflags "$flags" -o dist/chasen-server-linux-$arch ./cmd/chasen-server
          done
          cd dist && sha256sum chasen-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

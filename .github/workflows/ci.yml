name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # bin/public reads the messages of the new commits
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: bin/public
      - run: go vet ./...
      - run: go test ./...
        env:
          CHASEN_TEST_DOCKER: 1 # the runner has Docker: also the tests that start a container or pull an image

  # The end-to-end test: real Docker, the proxy on ports 80 and 443, an S3
  # store, and a private registry. A runner is a clean machine, so it always
  # can run here.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # The end-to-end test starts a real SSH server, for the SSH way to a server.
      - run: test -x /usr/sbin/sshd || (sudo apt-get update -q && sudo apt-get install -y -q openssh-server)
      - run: bin/e2e -test.v

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # gosec v2.29.0 pins a golang.org/x/tools too old to read Go 1.27.2
      # packages, so it is built with x/tools v0.52.0.
      - name: Build gosec
        run: |
          cd "$(mktemp -d)"
          go mod init gosec-build
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.52.0
          go build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
      # The server runs docker and reads paths and URLs from its own settings by
      # design, so gosec's taint rules (G702 command, G703 path, G704 SSRF) are
      # off; every other high-severity, high-confidence rule fails the build.
      - run: $RUNNER_TEMP/gosec -exclude=G702,G703,G704 -severity high -confidence high ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [go-test, e2e, gosec, govulncheck, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"

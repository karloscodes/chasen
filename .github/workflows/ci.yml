name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # bin/public reads the messages of the new commits
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bin/public
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CHASEN_TEST_DOCKER: 1 # the runner has Docker: also the tests that start a container or pull an image

  # The end-to-end test: real Docker, the proxy on ports 80 and 443, an S3
  # store, and a private registry. A runner is a clean machine, so it always
  # can run here.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The end-to-end test starts a real SSH server, for the SSH way to a server.
      - run: test -x /usr/sbin/sshd || (sudo apt-get update -q && sudo apt-get install -y -q openssh-server)
      - run: bin/e2e -test.v

  # The server runs docker and reads paths and URLs from its own settings by
  # design, so gosec's taint rules (G702 command, G703 path, G704 SSRF) are off;
  # every other high-severity, high-confidence rule fails the build.
  security:
    uses: karloscodes/workflows/.github/workflows/go-security.yml@v1.1.0
    with:
      gosec-flags: "-exclude=G702,G703,G704"

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@v1.1.0

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [go-test, e2e, security, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"

name: Security release

# When a security update merges, this tags the next patch and starts Release. The
# steps are in karloscodes/workflows. This file is the same in every CLI.
# By hand, for a merge it missed: gh workflow run "Security release"
on:
  workflow_run:
    workflows: ["Merge security updates"]
    types: [completed]
  workflow_dispatch:

# One release at a time.
concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions: write
    uses: karloscodes/workflows/.github/workflows/security-release.yml@v1.1.0

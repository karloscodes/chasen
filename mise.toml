[tasks.test]
description = "Unit tests. No Docker"
run = "go vet ./... && go test ./..."

[tasks.e2e]
description = "End-to-end test: real Docker, proxy on ports 80/443, S3 store. Needs sudo"
run = "bin/e2e"

[tasks.smol]
description = "A disposable Chasen server in a smolvm machine, for local tests. No sudo, no port 80"
run = "bin/smol"

[tasks.downloads]
description = "How often each file of each release was downloaded, from GitHub"
run = """gh api repos/karloscodes/chasen/releases --jq '.[] | "\\(.tag_name)  \\(.published_at[:10])", (.assets[] | select(.download_count > 0) | "  \\(.download_count)\\t\\(.name)")'"""

[tasks.dev]
description = "chasen from source against a mock server: the screen, or one command (mise run dev -- status)"
run = "bin/dev"
